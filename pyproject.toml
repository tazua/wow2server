[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wow2-server"
version = "0.3.0"
description = "Reimplementation of the Demonware auth/lobby servers for Worms Open Warfare 2 (PSP)"
readme = "README.md"
requires-python = ">=3.11"          # tomllib
license = "MIT"
authors = [{ name = "tazua" }]
keywords = ["demonware", "psp", "worms", "game-server", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Networking",
]

# The SERVER's dependencies only. The rig tooling needs more -- websocket-client
# to drive PPSSPP's debugger and opencv for the screen observer -- and a
# deployment has no use for either, so they are an extra rather than a
# requirement. Tiger192 is implemented in the package (tools/tiger.py), so
# there is no system dependency at all.
dependencies = ["pycryptodome>=3.19"]

[project.urls]
Homepage = "https://github.com/tazua/wow2server"

[project.scripts]
wow2-server = "wow2.authserver:cli"
# Real hardware cannot be pointed at the server with /etc/hosts -- the PSP has
# no such file -- so the DNS responder is part of a deployment, not a rig tool,
# and it gets a console script like the server does.
wow2-nsdns = "wow2.nsdns:main"
# The credential store needs an operator door: a console tells the server its
# name ONCE, in the create message, and identifies itself by a one-way hash
# ever after -- so a server that missed that message can never learn the name.
wow2-account = "wow2.accountcli:main"
# The SQLite store's door (§66): integrity check, JSON import/export, a
# consistent backup while the server runs, and the import/export round trip.
wow2-db = "wow2.dbcli:main"

# The modules live in tools/ and import each other flatly (each one puts its own
# directory on sys.path first), so they install as a package directory without
# any rewriting: `wow2.authserver` inserts the installed `wow2/` directory and
# `import bdproto` resolves inside it exactly as it does in the source tree.
[tool.setuptools]
# `packages` must be EXPLICIT here. Auto-discovery finds nothing, because there
# is no `wow2/` directory to find -- the mapping is what creates it, and find
# runs before the mapping applies. The wheel built cleanly and shipped only the
# entry point, which fails at import rather than at install.
packages = ["wow2"]

[tool.setuptools.package-data]
wow2 = ["nsdns-names"]
